name: API Doc - PR

# 신규 REST API Docs 흐름.
# - PR open/synchronize: 자동 draft 생성 안 함 (개발자가 로컬 /api-docs 로 생성)
# - PR merge to develop: docs/*.md 를 Dooray 페이지로 동기화 (sync_docs_to_dooray.py)
# - PR close (미merge): 별도 정리 작업 없음 (md 는 PR 머지 안 됐으면 어차피 develop 에 없음)

on:
  pull_request:
    types: [closed]
    branches:
      - develop
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dooray 호출 없이 미리보기만"
        required: false
        type: boolean
        default: false

concurrency:
  group: api-docs-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync-on-merge:
    name: Sync docs/*.md to Dooray (on merge)
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    uses: dev-billing/shared-workflows/.github/workflows/reusable-sync-docs-to-dooray.yml@main
    with:
      repo_name: ${{ github.repository }}
      dry_run: false
    secrets: inherit

  sync-manual:
    name: Sync docs/*.md to Dooray (manual)
    if: github.event_name == 'workflow_dispatch'
    uses: dev-billing/shared-workflows/.github/workflows/reusable-sync-docs-to-dooray.yml@main
    with:
      repo_name: ${{ github.repository }}
      # workflow_dispatch input 의 boolean 을 reusable 의 boolean input 으로
      # 전달 시 GitHub 가 가끔 string 으로 보고 type mismatch 를 내므로 명시
      dry_run: ${{ inputs.dry_run == true }}
    secrets: inherit
